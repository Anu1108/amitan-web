<h1>Туулай</h1>

<p>Миний дуртай амьтан бол туулай.</p>
<p>Энэ амьтан ой, тал хээрт амьдардаг.</p>
<p>Энэ амьтан өвс, ургамал иддэг.</p>
<p>Би энэ амьтанд дуртай, учир нь хөөрхөн.</p>
